spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# for uploading files
application.security.jwt.expiration=${JWT_TOKEN_EXPIRATION}
file.upload-dir={DATA_DIR}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${VITE_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${VITE_MAX_FILE_SIZE}
server.tomcat.max-swallow-size=-1
frontend.url=${FRONTEND_URL}
app.cors.allowed-origin=${FRONTEND_URL}
jwt.secret=${JWT_SECRET}

# for sending verification mail
spring.mail.host=${MAIL_SMTP}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
